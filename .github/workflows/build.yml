name: Build and publish add-on image

on:
  push:
    branches: [main]
    paths:
      - "wled_gateway/**"
      # Docs, screenshots and branding never enter the image, so editing them
      # shouldn't rebuild all three architectures and re-push a released tag.
      - "!wled_gateway/**.md"
      - "!wled_gateway/screenshots/**"
      - "!wled_gateway/icon.png"
      - "!wled_gateway/logo.png"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check app.py compiles
        run: python3 -m py_compile wled_gateway/app.py
      - name: Check config.json is valid JSON
        run: python3 -c "import json; json.load(open('wled_gateway/config.json'))"
      - name: Check every config option has a translation
        # Untranslated options show up in the add-on UI as bare schema keys, and
        # translations for keys that don't exist are ignored without complaint —
        # both fail quietly, so check them here.
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import json, sys, yaml
          schema = json.load(open("wled_gateway/config.json"))["schema"]
          trans = yaml.safe_load(open("wled_gateway/translations/en.yaml"))["configuration"]
          problems = []
          for key, spec in schema.items():
              if key not in trans:
                  problems.append(f"untranslated option: {key}")
                  continue
              # a list-of-dicts option (like devices) labels its sub-fields under "fields"
              inner = spec[0] if isinstance(spec, list) and spec and isinstance(spec[0], dict) else None
              if inner:
                  fields = (trans[key] or {}).get("fields") or {}
                  problems += [f"untranslated field: {key}.{f}" for f in inner if f not in fields]
                  problems += [f"orphan field: {key}.{f}" for f in fields if f not in inner]
          problems += [f"orphan option: {k}" for k in trans if k not in schema]
          if problems:
              for p in problems:
                  print(f"::error::translations/en.yaml out of sync — {p}")
              sys.exit(1)
          print("every config option and device field is translated")
          PY
      - name: Check CHANGELOG documents the current version
        # Images are tagged with the config.json version, so shipping a change
        # without bumping it silently overwrites an already-published tag and
        # Home Assistant never offers the update. Requiring a changelog entry
        # makes forgetting the bump a build failure instead.
        run: |
          version=$(python3 -c "import json;print(json.load(open('wled_gateway/config.json'))['version'])")
          if ! grep -q "^## ${version}$" wled_gateway/CHANGELOG.md; then
            echo "::error::wled_gateway/CHANGELOG.md has no '## ${version}' entry — bump the version or document it"
            exit 1
          fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read add-on version
        id: version
        run: echo "version=$(python3 -c "import json;print(json.load(open('wled_gateway/config.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ./wled_gateway
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wled-gateway-addon-wled_gateway-${{ matrix.arch }}:latest
            ghcr.io/${{ github.repository_owner }}/wled-gateway-addon-wled_gateway-${{ matrix.arch }}:${{ steps.version.outputs.version }}
