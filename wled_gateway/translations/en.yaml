configuration:
  auto_create_helpers:
    name: Create effect dropdowns automatically
    description: >-
      Creates an effect dropdown in Home Assistant for every device that
      doesn't name one below — called input_select.wled_effect_<id> and kept
      filled with that device's real effect list. Dropdowns you already have
      are never changed. Turn this off to create and name them yourself.
  auto_register_card:
    name: Add the preview card to your dashboards
    description: >-
      Installs the WLED Gateway card into Home Assistant and registers it as a
      dashboard resource, so it's ready to use and updates along with the
      add-on. Turn this off to manage the card yourself. Registration only works
      on storage-mode dashboards; with Lovelace in YAML mode the add-on says so
      on its own page and changes nothing.
  publish_status_entities:
    name: Create a status entity per device
    description: >-
      Publishes a binary_sensor for each device showing whether it's reachable,
      with the viewer count, frame rate and brightness as attributes — useful
      for an automation that notifies you when a strip drops off. These are set
      directly rather than by a real integration, so they disappear when Home
      Assistant restarts and are republished within a minute.
  devices:
    name: WLED devices
    description: >-
      One entry per WLED device. Restart the add-on after changing this list.
    fields:
      id:
        name: ID
        description: >-
          Short reference used in your dashboard card URLs, e.g. 1 gives
          ?wled=1. Any short value works and it doesn't have to match anything
          in Home Assistant.
      name:
        name: Name
        description: >-
          A label for your own reference, shown on the add-on's own page.
      ip:
        name: IP address
        description: >-
          The device's address on your network, e.g. 192.168.1.50.
      full_brightness_preview:
        name: Preview at full brightness
        description: >-
          On by default. The preview normally dims along with the device,
          because WLED sends the live view already scaled by its brightness —
          this scales it back up so the colours always show at full strength.
          Turn it off for this device to see the preview exactly as the strip
          looks. Very low brightness will still look grainy, since the detail
          is already lost before it reaches the add-on.
      preview_brightness:
        name: Fixed preview brightness % (optional)
        description: >-
          Leave empty to follow the device (the setting above). Set a number to
          pin the preview to a constant instead, ignoring the device's
          brightness entirely: 100 shows the colours exactly as received, 175 is
          the boost this preview has always used, higher is punchier. Use this
          if following the device looks uneven to you.
      input_select:
        name: Effect dropdown (optional)
        description: >-
          Leave this empty — a dropdown is created for you automatically, named
          input_select.wled_effect_<id> from the ID above. Only fill it in to
          reuse a dropdown you already have under a different name.
