version: 2
updates:
  # The workflow's actions drifted a full major behind before anyone noticed,
  # which surfaced as Node runtime deprecation warnings on every build. Let
  # Dependabot open the bump PRs instead of catching it by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - dependencies
